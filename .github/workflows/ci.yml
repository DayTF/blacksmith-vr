name: Headless validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headless:
    name: Godot import and simulation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require an issue reference
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eiq '(closes|fixes|part of)[[:space:]]+(#|https://github.com/DayTF/blacksmith-vr/issues/)[0-9]+'; then
            echo 'PR description must include Closes #N, Fixes #N, or Part of #N.' >&2
            exit 1
          fi

      - name: Install Godot Standard
        shell: bash
        run: |
          asset="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${asset}" \
            --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$GODOT_SHA512" "$RUNNER_TEMP/$asset" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/${asset%.zip}" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project and check scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot reported import or script errors.' >&2
            exit 1
          fi

      - name: Run simulation suites
        run: godot --headless --path . --script tests/run_all.gd
